
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nithya's Website</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;
        }

        .container {
            text-align: center;
            padding: 50px 70px;
            border-radius: 25px;

            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.25);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);

            animation: fadeIn 1.2s ease;
        }

        .small-text {
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 15px;
            opacity: 0.85;
        }

        h1 {
            font-size: 52px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 15px;

            text-shadow:
                0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .description {
            font-size: 18px;
            font-weight: 300;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .button {
            display: inline-block;
            padding: 12px 30px;

            color: #667eea;
            background: white;

            text-decoration: none;
            font-weight: 600;

            border-radius: 30px;

            transition: all 0.3s ease;
        }

        .button:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            background: #f5f5f5;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {

            .container {
                width: 90%;
                padding: 40px 20px;
            }

            h1 {
                font-size: 34px;
            }

            .description {
                font-size: 15px;
            }

            .small-text {
                font-size: 12px;
                letter-spacing: 3px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <p class="small-text">Welcome to</p>

        <h1>THIS IS NITHYA'S WEBSITE</h1>

        <p class="description">
            A simple, modern and creative web experience.
        </p>

        <a href="#" class="button">Explore</a>

    </div>

</body>
</html>
