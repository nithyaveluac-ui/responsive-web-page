<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nithya's Login</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left, #8b5cf6, transparent 35%),
                radial-gradient(circle at bottom right, #06b6d4, transparent 35%),
                linear-gradient(135deg, #111827, #1e1b4b);

            color: white;
            padding: 20px;
        }

        /* Login Card */

        .login-container {
            width: 100%;
            max-width: 420px;

            padding: 45px 40px;

            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;

            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);

            animation: slideUp 0.8s ease;
        }

        /* Logo */

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: linear-gradient(135deg, #8b5cf6, #06b6d4);

            font-size: 28px;
            font-weight: 700;

            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
        }

        h1 {
            text-align: center;

            font-size: 32px;
            font-weight: 600;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            font-size: 14px;
            font-weight: 300;

            color: rgba(255, 255, 255, 0.7);

            margin-bottom: 30px;
        }

        /* Input */

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;

            font-size: 14px;
            font-weight: 500;

            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;

            padding: 14px 16px;

            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;

            outline: none;

            background: rgba(255, 255, 255, 0.08);

            color: white;

            font-family: 'Poppins', sans-serif;
            font-size: 14px;

            transition: 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        .input-group input:focus {
            border-color: #8b5cf6;

            background: rgba(255, 255, 255, 0.12);

            box-shadow: 0 0 15px rgba(139, 92, 246, 0.25);
        }

        /* Remember + Forgot */

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin: 5px 0 25px;

            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;

            color: rgba(255, 255, 255, 0.75);
        }

        .remember input {
            accent-color: #8b5cf6;
        }

        .forgot {
            color: #c4b5fd;
            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* Login Button */

        .login-btn {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(135deg, #8b5cf6, #06b6d4);

            color: white;

            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.3s ease;

            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-3px);

            box-shadow: 0 15px 30px rgba(139, 92, 246, 0.45);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* Footer */

        .signup {
            text-align: center;

            margin-top: 25px;

            font-size: 13px;

            color: rgba(255, 255, 255, 0.65);
        }

        .signup a {
            color: #c4b5fd;

            text-decoration: none;

            font-weight: 600;
        }

        .signup a:hover {
            text-decoration: underline;
        }

        /* Animation */

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile */

        @media (max-width: 500px) {

            .login-container {
                padding: 35px 25px;
            }

            h1 {
                font-size: 27px;
            }

            .logo {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            N
        </div>

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to Nithya's Website
        </p>

        <form>

            <div class="input-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <div class="options">

                <label class="remember">
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#" class="forgot">
                    Forgot password?
                </a>

            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <p class="signup">
            Don't have an account?
            <a href="#">Create account</a>
        </p>

    </div>

</body>
</html>
